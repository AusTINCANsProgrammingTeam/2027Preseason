name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events for main and develop branches
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main

jobs:
  roboRIO-ci:
    uses: $/.github/workflows/roboRIO.yml
  systemcore-ci:
    uses: $/.github/workflows/systemcore.yml
